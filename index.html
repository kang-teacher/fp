<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설명서 영상 보기</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      font-weight: 500;
    }

    .video-container {
      width: 90%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <h1>설명서 (KOR)</h1>

  <div class="video-container">
    <video controls preload="metadata">
      <source src="https://raw.githubusercontent.com/bio9gle/info1/main/%EC%84%A4%EB%AA%85%EC%84%9C(KOR).mp4" type="video/mp4">
      사용 중인 브라우저가 비디오 태그를 지원하지 않습니다.
    </video>
  </div>

</body>
</html>
